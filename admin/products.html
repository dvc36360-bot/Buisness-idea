<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products | JACT Admin</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script defer src="admin.js"></script></head><body class="admin-body"><header class="admin-header"><a class="brand" href="dashboard.html"><span class="brand-mark">J</span><span>JACT <small>CONTROL ROOM</small></span></a><div class="admin-header-right"><span id="admin-email"></span><button id="logout-btn" class="button button-small button-ghost">Log out</button></div></header><main class="admin-content"><nav class="admin-nav"><a href="dashboard.html">Overview</a><a href="products.html">Products</a><a href="bookings.html">Bookings</a></nav><div class="admin-title"><div><p class="eyebrow">INVENTORY</p><h1>Manage <em>products.</em></h1></div></div><section class="admin-table-card"><h2>Add a product</h2><form id="product-form" class="mini-form"><label>Product name<input name="name" required maxlength="120"></label><div class="form-row"><label>Price (ZAR)<input name="price" type="number" min="0" step="0.01" required></label><label>Stock quantity<input name="stock" type="number" min="0" step="1" value="0" required></label></div><label>Image URL <span class="optional">(optional)</span><input name="image_url" type="url" placeholder="https://…"></label><label>Description<textarea name="description" rows="2" maxlength="500"></textarea></label><button class="button button-primary">Add product</button><p id="product-message" class="form-message" role="status"></p></form></section><section class="admin-table-card"><h2>Current products</h2><div id="admin-products">Loading products…</div></section></main></body></html>
