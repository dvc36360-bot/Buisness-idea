<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090c0f"><title>Orders | JACT Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script defer src="../app.js"></script><script defer src="../push.js"></script><script defer src="admin.js"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#090c0f;--panel:#12181d;--panel2:#192128;--line:#29343d;--gold:#e6a52e;--gold2:#ffc45c;--white:#f5f7f8;--muted:#9ba8b1;--green:#59c58e;--red:#ef7770}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#302313 0,transparent 34%),var(--bg);color:var(--white);font:14px/1.6 Inter,Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}
.admin-header{height:76px;border-bottom:1px solid var(--line);background:#090c0feF;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,54px);position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;font:800 23px 'Barlow Condensed',sans-serif;letter-spacing:.07em}.brand-mark{height:42px;width:42px;border:2px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-size:25px}.brand small{display:block;font:700 9px Inter,sans-serif;color:var(--muted);letter-spacing:.23em}
.admin-header-right{display:flex;align-items:center;gap:15px;color:var(--muted);font-size:12px}.admin-header-right a:hover{color:var(--gold)}
.admin-layout{width:min(1440px,100%);margin:auto;padding:30px clamp(14px,3vw,42px);display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px}
.sidebar{align-self:start;background:linear-gradient(160deg,#151d23,#101519);border:1px solid var(--line);border-radius:18px;padding:15px;position:sticky;top:96px}
.side-label,.eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.side-label{padding:8px 11px 12px}.sidebar a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:#b9c3ca;font-weight:600;margin:3px 0;transition:.2s}.sidebar a:hover,.sidebar a.active{background:#302719;color:var(--gold2)}.nav-icon{width:22px;text-align:center;font-size:16px}
.main{min-width:0}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:2px 0 24px}.page-heading h1,.login-title{font:800 clamp(36px,5vw,54px)/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:8px 0 0;letter-spacing:.01em}.page-heading h1 em,.login-title em{color:var(--gold);font-style:normal}.subheading{color:var(--muted);margin:9px 0 0}.admin-pill{border:1px solid #67502c;background:#211b11;color:#f2c978;padding:8px 12px;border-radius:30px;font-size:10px;font-weight:800;letter-spacing:.12em;white-space:nowrap}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 20px}.stat-card{background:linear-gradient(145deg,#182128,#11171c);border:1px solid var(--line);border-radius:16px;padding:19px;position:relative;overflow:hidden}.stat-card:after{content:"";position:absolute;width:90px;height:90px;border:1px solid #e6a52e22;border-radius:50%;right:-30px;top:-35px}.stat-card span{color:var(--muted);font-size:12px;font-weight:600}.stat-card strong{display:block;font:800 38px 'Barlow Condensed',sans-serif;color:var(--gold);margin-top:7px}
.panel{background:linear-gradient(145deg,#151d23,#101519);border:1px solid var(--line);border-radius:17px;padding:21px;margin:0 0 18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panel h2{font:700 24px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}.panel-note{font-size:11px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label,.mini-form label{font-size:11px;font-weight:700;color:#cbd3d8;letter-spacing:.04em}.field input,.field textarea,.field select,.mini-form input,.mini-form textarea,.admin-table-scroll select{width:100%;background:#0b1014;color:var(--white);border:1px solid #34414a;border-radius:10px;padding:12px 13px;outline:none;min-width:0}.field input:focus,.field textarea:focus,.field select:focus,.mini-form input:focus,.mini-form textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e6a52e18}.field textarea,.mini-form textarea{resize:vertical;min-height:85px}
.mini-form{display:grid;gap:13px;max-width:720px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px}.mini-form label{display:grid;gap:7px}
.button{border:0;border-radius:10px;padding:11px 16px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.button-primary{background:var(--gold);color:#17130c}.button-primary:hover{background:var(--gold2)}.button-ghost{background:#202a31;border:1px solid #3a4650;color:#e7ecef}.button-ghost:hover{border-color:var(--gold);color:var(--gold2)}.button-danger{background:#482321;color:#ffc5c1}.button-small{padding:7px 10px;font-size:11px}.button:disabled{opacity:.5;cursor:wait}
.admin-table-scroll{width:100%;overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid #27323a;vertical-align:top;font-size:12px}th{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.12em;background:#0d1317}td{color:#d6dde1}tbody tr:hover{background:#ffffff05}td small{color:var(--muted)}td b{color:#fff}.admin-table-scroll select{padding:8px;font-size:11px;min-width:110px}
.muted{color:var(--muted)}.form-message,.status{color:var(--muted);font-size:12px}.status.show{padding:10px 12px;border-radius:9px;background:#182b22;color:#b9f0d1}.status.error{background:#351d1d;color:#ffc4c1}
.login-wrap{width:min(460px,calc(100% - 30px));margin:8vh auto;background:linear-gradient(145deg,#182128,#101519);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 80px #0008}.login-wrap .brand{margin-bottom:36px}.login-wrap .form-card{display:grid;gap:17px;margin-top:24px}.login-wrap label{display:grid;gap:7px;color:#cbd3d8;font-size:12px;font-weight:700}.login-wrap input{width:100%;background:#0b1014;color:#fff;border:1px solid #34414a;border-radius:10px;padding:14px;outline:none}.login-wrap input:focus{border-color:var(--gold)}.login-caption{color:var(--muted);font-size:12px}.login-footer{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;color:#7f8b93;font-size:10px}
@media(max-width:850px){.admin-layout{grid-template-columns:1fr;padding-top:17px;gap:16px}.sidebar{position:static;display:flex;overflow:auto;gap:5px;padding:8px}.side-label{display:none}.sidebar a{white-space:nowrap;margin:0;padding:10px 12px}.nav-icon{display:none}.page-heading{align-items:flex-start;flex-direction:column}.admin-pill{align-self:flex-start}}
@media(max-width:560px){.admin-header{height:66px;padding:0 14px}.brand{font-size:20px}.brand-mark{width:36px;height:36px}.admin-header-right{gap:7px}.admin-header-right #admin-email{display:none}.stats-grid{grid-template-columns:1fr}.stat-card{padding:15px}.stat-card strong{font-size:32px}.panel{padding:15px}.form-grid,.form-row{grid-template-columns:1fr}.field.full{grid-column:auto}.page-heading h1{font-size:42px}}
</style></head>
